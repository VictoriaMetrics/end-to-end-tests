apiVersion: operator.victoriametrics.com/v1beta1
kind: VMCluster
metadata:
  name: vmcluster-name
spec:
  retentionPeriod: 1d
  replicationFactor: 1
  vmselect:
    replicaCount: 1
  vminsert:
    replicaCount: 1
  vmstorage:
    replicaCount: 1
    storageDataPath: /vm-data
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: e2e-expandable
          resources:
            requests:
              storage: 1Gi
