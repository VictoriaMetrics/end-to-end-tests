apiVersion: operator.victoriametrics.com/v1beta1
kind: VMCluster
metadata:
  name: vmcluster-name
spec:
  retentionPeriod: 1d
  replicationFactor: 1
  vmselect:
    replicaCount: 1
    extraStorageNodes:
      - addr: external.example:8401
      - addr: external.example:8401
  vminsert:
    replicaCount: 1
  vmstorage:
    replicaCount: 1
    storageDataPath: /vm-data
