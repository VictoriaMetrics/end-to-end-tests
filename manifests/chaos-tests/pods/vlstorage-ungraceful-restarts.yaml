apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: vlstorage-ungraceful-restarts
spec:
  entry: serial-restart
  templates:
    - name: serial-restart
      templateType: Serial
      deadline: 5m
      children:
        - kill-pod-0
        - wait-for-recovery
        - kill-pod-1
    - name: kill-pod-0
      templateType: PodChaos
      deadline: 2m
      podChaos:
        selector:
          namespaces:
            - vl
          labelSelectors:
            app.kubernetes.io/name: vlstorage
            statefulset.kubernetes.io/pod-name: vlstorage-vl-0
        mode: one
        action: pod-kill
        gracePeriod: 1
    - name: wait-for-recovery
      templateType: Suspend
      deadline: 30s
    - name: kill-pod-1
      templateType: PodChaos
      deadline: 2m
      podChaos:
        selector:
          namespaces:
            - vl
          labelSelectors:
            app.kubernetes.io/name: vlstorage
            statefulset.kubernetes.io/pod-name: vlstorage-vl-1
        mode: one
        action: pod-kill
        gracePeriod: 1
