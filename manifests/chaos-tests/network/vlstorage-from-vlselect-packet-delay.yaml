kind: NetworkChaos
apiVersion: chaos-mesh.org/v1alpha1
metadata:
  name: vlstorage-from-vlselect-packet-delay
spec:
  selector:
    namespaces:
      - vm
    labelSelectors:
      app.kubernetes.io/name: vlstorage
  mode: all
  action: delay
  duration: 7m
  delay:
    latency: 30s
    correlation: '0'
    jitter: 5s
  direction: from
  target:
    selector:
      namespaces:
        - vm
      labelSelectors:
        app.kubernetes.io/name: vlselect
    mode: all
