apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmgather
  labels:
    app: vmgather
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmgather
  template:
    metadata:
      labels:
        app: vmgather
    spec:
      containers:
        - name: vmgather
          image: quay.io/vrutkovs/vmgather:latest
          imagePullPolicy: Always
          args:
            - -debug
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          # Requests trimmed to observed usage (<1m CPU, ~3Mi memory); limits
          # keep headroom for occasional gather bursts.
          resources:
            requests:
              cpu: "100m"
              memory: "32Mi"
            limits:
              cpu: "300m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: vmgather
  labels:
    app: vmgather
spec:
  type: ClusterIP
  selector:
    app: vmgather
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
