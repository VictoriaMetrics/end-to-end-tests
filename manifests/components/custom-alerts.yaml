apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: custom-alert-rules
  namespace: monitoring
spec:
  groups:
  - name: custom-rules
    rules:
    - alert: CustomTooHighSlowInsertsRate
      expr: (sum(rate(vm_slow_row_inserts_total[1m])) by(namespace) / sum(rate(vm_rows_inserted_total[1m])) by(namespace)) > 0.5
      for: 30s
      labels:
        severity: warning
    - alert: CustomHighCPUUsage
      expr: |-
        sum(rate(container_cpu_usage_seconds_total{container!="",namespace=~"vm-.*"}[1m])) by (namespace, pod)
          /
        sum(kube_pod_container_resource_requests{container!="",resource="cpu",unit="core",namespace=~"vm-.*"}) by (namespace, pod)
          > 3
      for: 1m
      labels:
        severity: warning
    - alert: CustomHighMemoryUsage
      expr: |-
        sum(max_over_time(container_memory_working_set_bytes{container!="",namespace=~"vm-.*"}[1m])) by (namespace, pod)
          /
        sum(container_spec_memory_limit_bytes{container!="",namespace=~"vm-.*"}) by (namespace, pod)
          > 0.8
      for: 0s
      labels:
        severity: warning
    - alert: CustomRPCErrors
      expr: |-
        sum(
          increase(vm_rpc_connection_errors_total{namespace=~"vm-(vminsert-to-vmstorage-packet-corrupt|vmstorage-from-vminsert-packet-loss|vmstorage-from-vmselect-packet-delay)-.*"}[1m])
            + increase(vm_rpc_dial_errors_total{namespace=~"vm-(vminsert-to-vmstorage-packet-corrupt|vmstorage-from-vminsert-packet-loss|vmstorage-from-vmselect-packet-delay)-.*"}[1m])
            + increase(vm_rpc_handshake_errors_total{namespace=~"vm-(vminsert-to-vmstorage-packet-corrupt|vmstorage-from-vminsert-packet-loss|vmstorage-from-vmselect-packet-delay)-.*"}[1m])
        ) by (namespace) > 0
      for: 30s
      labels:
        severity: warning
    - alert: CustomIOPressureHigh
      expr: |-
        sum(rate(container_pressure_io_stalled_seconds_total{
          container!="", namespace=~"vm-.*"
        }[1m])) by (namespace, pod) > 0.002
      for: 30s
      labels:
        severity: warning
    - alert: CustomSlowQueries
      expr: |-
        histogram_quantile(
          0.99,
          sum(rate(vmselect_request_duration_seconds_bucket{
            namespace=~"vm-.*"
          }[1m])) by (namespace, pod, vmrange)
        ) > 30
      for: 30s
      labels:
        severity: warning
    # 3m variants of default alerts (15m `for`) asserted by vm-load problem-journey tests.
    - alert: CustomTooHighQueryLoad
      expr: sum(increase(vm_concurrent_select_limit_timeout_total{namespace=~"vm-load-.*"}[1m])) by (namespace) > 0
      for: 3m
      labels:
        severity: warning
    - alert: CustomTooHighChurnRate
      expr: |-
        sum(rate(vm_new_timeseries_created_total{namespace=~"vm-load-.*"}[1m])) by (namespace)
          /
        sum(rate(vm_rows_added_to_storage_total{namespace=~"vm-load-.*"}[1m])) by (namespace)
          > 0.1
      for: 3m
      labels:
        severity: warning
    - alert: CustomPersistentQueueIsDroppingData
      expr: sum(increase(vm_persistentqueue_bytes_dropped_total{namespace=~"vm-load-.*"}[1m])) by (namespace) > 0
      for: 3m
      labels:
        severity: warning
    - alert: CustomTooManyRemoteWriteErrors
      expr: sum(rate(vmagent_remotewrite_retries_count_total{namespace=~"vm-load-.*"}[1m])) by (namespace) > 0
      for: 3m
      labels:
        severity: warning
    - alert: CustomTooManyMissedIterations
      expr: sum(increase(vmalert_iteration_missed_total{namespace=~"vm-load-.*"}[1m])) by (namespace) > 0
      for: 3m
      labels:
        severity: warning
