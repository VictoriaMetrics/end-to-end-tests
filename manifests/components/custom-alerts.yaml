apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: custom-alert-rules
  namespace: monitoring
spec:
  groups:
  - name: custom-rules
    rules:
    - alert: CustomTooHighSlowInsertsRate
      expr: (sum(rate(vm_slow_row_inserts_total[1m])) by(namespace) / sum(rate(vm_rows_inserted_total[1m])) by(namespace)) > 0.5
      for: 30s
      labels:
        severity: warning
    - alert: CustomHighCPUUsage
      expr: |-
        sum(rate(container_cpu_usage_seconds_total{container!="",namespace=~"vm-.*"}[1m])) by (namespace, pod)
          /
        sum(kube_pod_container_resource_requests{container!="",resource="cpu",unit="core",namespace=~"vm-.*"}) by (namespace, pod)
          > 3
      for: 1m
      labels:
        severity: warning
    - alert: CustomHighMemoryUsage
      expr: |-
        sum(container_memory_working_set_bytes{container!="",namespace=~"vm-.*"} / container_spec_memory_limit_bytes{container!="",namespace=~"vm-.*"}) by (namespace, pod) > 0.9
      for: 1m
      labels:
        severity: warning
    - alert: CustomRPCErrors
      expr: |-
        sum(
          increase(vm_rpc_connection_errors_total[1m])
            + increase(vm_rpc_dial_errors_total[1m])
            + increase(vm_rpc_handshake_errors_total[1m])
        ) by (namespace) > 0
      for: 30s
      labels:
        severity: warning
    - alert: CustomIOPressureHigh
      expr: |-
        sum(rate(container_pressure_io_stalled_seconds_total{
          container!="", namespace=~"vm-.*"
        }[1m])) by (namespace, pod) > 0.5
      for: 1m
      labels:
        severity: warning
